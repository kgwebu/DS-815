name: Build and Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install the dependencies
        run: |
          python -m pip install -r requirements.txt
      - name: Build the JupyterLite site
        run: |
          mkdir -p build/contents
          cp -a worksheet build/contents/
          # Start the organized course with separate persistent browser storage.
          # Existing work in the original browser store remains recoverable.
          printf '%s\n' '{"jupyter-config-data":{"contentsStorageName":"DS-815 Student Worksheets v1","workspacesStorageName":"DS-815 Student Worksheets Workspaces v1"},"jupyter-lite-schema-version":0}' > jupyter-lite.json
          jupyter lite build --contents build/contents --output-dir dist
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
